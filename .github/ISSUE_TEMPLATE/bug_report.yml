name: Bug report
description: Report a problem with Scout
labels: [bug]
body:
  - type: input
    id: scout-version
    attributes:
      label: Scout version
      placeholder: "0.3.0"
    validations:
      required: true
  - type: input
    id: premiere-version
    attributes:
      label: Premiere Pro version
      placeholder: "26.3.2"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What went wrong, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a project with...
        2. Click...
        3. ...
    validations:
      required: true
